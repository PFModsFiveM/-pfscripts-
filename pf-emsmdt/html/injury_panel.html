<!-- EMS MDT Injury Assessment Panel -->
<div id="injuryPanel" class="injury-panel hidden">
    <div class="injury-header">
        <div class="injury-title">
            <h2>INJURY ASSESSMENT</h2>
            <span id="patientNameDisplay" class="patient-name"></span>
        </div>
        <button class="injury-close-btn" onclick="closeInjuryPanel()">×</button>
    </div>

    <div class="injury-container">
        <!-- Left: Body Map Visualization -->
        <div class="injury-body-map">
            <svg id="bodyMapSVG" viewBox="0 0 200 400" width="200" height="400">
                <!-- Head -->
                <circle id="zone-head" class="body-zone" cx="100" cy="40" r="25" data-zone="head" onclick="selectBodyZone('head')"/>
                <text x="100" y="50" text-anchor="middle" class="body-zone-label">Head</text>

                <!-- Torso -->
                <rect id="zone-torso" class="body-zone" x="80" y="70" width="40" height="80" data-zone="torso" rx="5" onclick="selectBodyZone('torso')"/>
                <text x="100" y="120" text-anchor="middle" class="body-zone-label">Chest</text>

                <!-- Left Arm -->
                <rect id="zone-left_arm" class="body-zone" x="40" y="90" width="30" height="70" data-zone="left_arm" rx="5" onclick="selectBodyZone('left_arm')"/>
                <text x="55" y="130" text-anchor="middle" class="body-zone-label">L Arm</text>

                <!-- Right Arm -->
                <rect id="zone-right_arm" class="body-zone" x="130" y="90" width="30" height="70" data-zone="right_arm" rx="5" onclick="selectBodyZone('right_arm')"/>
                <text x="145" y="130" text-anchor="middle" class="body-zone-label">R Arm</text>

                <!-- Left Leg -->
                <rect id="zone-left_leg" class="body-zone" x="75" y="160" width="20" height="90" data-zone="left_leg" rx="5" onclick="selectBodyZone('left_leg')"/>
                <text x="85" y="210" text-anchor="middle" class="body-zone-label">L Leg</text>

                <!-- Right Leg -->
                <rect id="zone-right_leg" class="body-zone" x="105" y="160" width="20" height="90" data-zone="right_leg" rx="5" onclick="selectBodyZone('right_leg')"/>
                <text x="115" y="210" text-anchor="middle" class="body-zone-label">R Leg</text>
            </svg>
        </div>

        <!-- Right: Injury Details -->
        <div class="injury-details">
            <div class="injury-stats">
                <div class="stat-item">
                    <span class="stat-label">Overall Health</span>
                    <div class="health-bar">
                        <div id="overallHealthBar" class="health-fill" style="width: 100%"></div>
                    </div>
                    <span id="overallHealthPercent" class="stat-value">100%</span>
                </div>
            </div>

            <div class="selected-zone-info">
                <h3 id="selectedZoneName">Select Body Part</h3>
                
                <div id="injuriesList" class="injuries-list">
                    <p class="no-injuries">No injuries selected</p>
                </div>

                <div class="zone-health">
                    <span class="zone-health-label">Zone Health:</span>
                    <div class="health-bar">
                        <div id="zoneHealthBar" class="health-fill" style="width: 100%"></div>
                    </div>
                    <span id="zoneHealthPercent" class="zone-health-value">100%</span>
                </div>
            </div>

            <!-- Treatment Options -->
            <div class="treatment-section">
                <h3>Available Treatments</h3>
                <div class="treatment-buttons">
                    <button class="treatment-btn" onclick="applyTreatment('bandage')">Bandage Wound</button>
                    <button class="treatment-btn" onclick="applyTreatment('splint')">Apply Splint</button>
                    <button class="treatment-btn" onclick="applyTreatment('oxygen')">Give Oxygen</button>
                    <button class="treatment-btn revive" onclick="applyTreatment('revive')">Revive Patient</button>
                </div>
            </div>

            <!-- Medical Notes -->
            <div class="medical-notes">
                <h3>Medical Notes</h3>
                <textarea id="medicalNotes" placeholder="Add medical notes..."></textarea>
            </div>
        </div>
    </div>
</div>
