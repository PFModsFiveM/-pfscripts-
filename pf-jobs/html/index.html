<!DOCTYPE html>
<html lang="en" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tablet</title>
    <!-- Core/Shared Styles -->
    <link rel="stylesheet" href="css/core.css">
    <!-- Job-Specific Styles -->
    <link rel="stylesheet" href="css/gruppe6.css">
    <link rel="stylesheet" href="css/business.css">
    <link rel="stylesheet" href="css/garbage.css">
    <link rel="stylesheet" href="css/taxi.css">
        <link rel="stylesheet" href="css/scoreboard.css">
    <!-- Ensure scaling happens from the center -->
    <style>
        .tablet { transform-origin: center center; }
        body, html { background: transparent !important; }
    </style>
</head>
<body style="background: transparent !important;">
    <!-- Job Scoreboard (76b-ui EXACT structure) -->
    <div class="scoreboard-container" id="scoreboard-main">
        <div class="scoreboard-title" id="scoreboard-title">Gruppe6 Contractor</div>
        <div class="scoreboard-separator"></div>
        <div class="scoreboard-separator-glow"></div>
        <div class="scoreboard-subtitle" id="scoreboard-subtitle">Waiting for job offer</div>
    </div>

    <div id="tablet-container" class="hidden">
        <div class="tablet">
            <div class="tablet-screen">
                <div class="status-bar">
                    <div class="status-left">
                        <span id="time">13:07</span>
                    </div>
                    <div class="status-right">
                        <span class="icon">📶</span>
                        <span class="icon">⚙️</span>
                        <span class="icon notification">🔔</span>
                    </div>
                </div>
                
                <div class="app-grid" id="app-grid">
                    <!-- Apps will be dynamically added here -->
                </div>

                <!-- Windows container -->
                <div class="windows-container" id="windows-container">
                    <!-- App windows will be dynamically added here -->
                </div>

                <div class="dock">
                    <div class="dock-item" data-app="browser">
                        <span class="dock-icon">🌐</span>
                        <span class="dock-label">Browser</span>
                    </div>
                    <div class="dock-item" data-app="explorer">
                        <span class="dock-icon">📂</span>
                        <span class="dock-label">Explorer</span>
                    </div>
                    <div class="dock-item" data-app="recycle">
                        <span class="dock-icon">🗑️</span>
                        <span class="dock-label">Recycle</span>
                    </div>
                    <!-- Minimized windows will be added here dynamically -->
                </div>

                <div class="tablet-logo">
                    <div class="logo-text">PFMods</div>
                </div>

                <!-- Bottom-right game clock -->
                <div class="corner-clock">
                    <div class="corner-time" id="game-time">16:01</div>
                    <div class="corner-date" id="game-date">01/19/2024</div>
                    <div class="clock-accent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
    <script src="business.js"></script>
    <script>
        (function () {
            // Uniform scaling: keep a constant design coordinate system
            // and scale the whole tablet so layout never reflows across resolutions.
            const BASE_W = 1180; // tablet base width
            const BASE_H = 780; // tablet base height
            // Use a slightly smaller vertical fill on 1080p only; keep 2k/4k unchanged
            function resizeTablet() {
                const tablet = document.querySelector('.tablet');
                if (!tablet) return;
                const vw = window.innerWidth;
                const vh = window.innerHeight;
                const GAP_1080 = 0.74; // reduce scale a bit more at 1080p
                const GAP_DEFAULT = 0.90; // original for 2k/4k
                const gap = vh <= 1080 ? GAP_1080 : GAP_DEFAULT;
                // Height-limited scale leaves uniform gap (vh * (1-gap))/2 top & bottom
                const heightLimitedScale = (vh * gap) / BASE_H;
                const scale = Math.min(vw / BASE_W, heightLimitedScale);
                tablet.style.transform = `scale(${scale})`;
            }

            window.addEventListener('load', resizeTablet);
            window.addEventListener('resize', resizeTablet);
            window.addEventListener('message', resizeTablet);
            resizeTablet();

            // ESC close (kept)
            function postClose() {
                const container = document.getElementById('tablet-container');
                if (container) container.classList.add('hidden');
                fetch('https://pf-jobs/closeTablet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json; charset=UTF-8' },
                    body: JSON.stringify({})
                }).catch(() => {});
            }
            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') { e.preventDefault(); postClose(); }
            });

            // IRL time top-left (kept)
            function fmt2(n){return String(n).padStart(2,'0');}
            function updateIRLTopLeft(){
                const now=new Date();
                const hh=fmt2(now.getHours());const mm=fmt2(now.getMinutes());
                const top=document.getElementById('time'); if(top) top.textContent=`${hh}:${mm}`;
            }
            updateIRLTopLeft(); setInterval(updateIRLTopLeft,5000);
        })();
    </script>
</body>
</html>
